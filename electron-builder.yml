appId: com.pipeach.desktop
productName: 桃屁屁
directories:
  output: release
files:
  - out/**
  - assets/generated/final/**
  - assets/manifest.json
mac:
  icon: assets/generated/final/idle.png
  category: public.app-category.productivity
  target:
    - target: dir
      arch:
        - arm64
        - x64
win:
  icon: assets/generated/final/idle.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
