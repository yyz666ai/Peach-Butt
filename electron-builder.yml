appId: com.pipeach.desktop
productName: 桃屁屁
directories:
  output: release
files:
  - out/**
  - assets/generated/final/**
  - assets/manifest.json
  - assets/video/generated/**
  - assets/video/manifest.json
  - assets/app-icon/**
mac:
  icon: assets/app-icon/pipeach.icns
  category: public.app-category.productivity
  target:
    - target: dir
      arch:
        - arm64
        - x64
win:
  icon: assets/app-icon/pipeach.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
